<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login-reg.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Doctor Login</h1>
        <p class="subtitle">Sign in to your doctor account</p>

        <form action="dashboard.html" onsubmit="return loginDoctor()">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <p id="loginMessage" class="message"></p>
            <button type="submit" class="btn">Login</button>
        </form>

        <p class="auth-link">Don't have an account? <a href="register.html">Register</a></p>
    </div>

    <script src="js/login-reg.js"></script>
</body>
</html>
