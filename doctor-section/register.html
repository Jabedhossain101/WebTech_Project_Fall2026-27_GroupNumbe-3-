<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login-reg.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Doctor Registration</h1>
        <p class="subtitle">Create your doctor account</p>

        <form action="login.html" onsubmit="return registerDoctor()">
            <label for="doctorName">Full Name</label>
            <input type="text" id="doctorName" placeholder="Enter your full name">

            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail" placeholder="Enter your email">

            <label for="department">Department</label>
            <select id="department">
                <option value="">Select your department</option>
                <option value="General Medicine">General Medicine</option>
                <option value="Cardiology">Cardiology</option>
                <option value="Neurology">Neurology</option>
                <option value="Orthopedics">Orthopedics</option>
                <option value="Pediatrics">Pediatrics</option>
                <option value="Dermatology">Dermatology</option>
                <option value="ENT">ENT</option>
            </select>

            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" placeholder="Create a password">

            <p id="registerMessage" class="message"></p>
            <button type="submit" class="btn">Register</button>
        </form>

        <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script src="js/login-reg.js"></script>
</body>
</html>
