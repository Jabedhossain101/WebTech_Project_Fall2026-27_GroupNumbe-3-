<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Settings</title>
  <link rel="stylesheet" href="css/common.css" />
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>HMS Admin</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="doctors.html">Doctors</a>
      <a href="patients.html">Patients</a>
      <a href="appointments.html">Appointments</a>
      <a href="billing.html">Billing</a>
      <a href="settings.html" class="active">Settings</a>
    </aside>
    <main class="main">
      <div class="topbar">
        <span id="adminWelcome"></span>
        <button type="button" id="logoutBtn" class="danger">Logout</button>
      </div>
      <div class="card">
        <h3>Hospital Settings</h3>
        <form id="settingsForm" class="form-grid">
          <input type="text" id="hospitalName" placeholder="Hospital Name" required />
          <input type="email" id="supportEmail" placeholder="Support Email" required />
          <button type="submit">Save Settings</button>
        </form>
        <p id="settingsMsg" style="margin-top: 10px; color: #166534;"></p>
      </div>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
</body>

</html>
