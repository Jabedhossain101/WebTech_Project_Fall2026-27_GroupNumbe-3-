<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Patients</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/patients.css" />
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>HMS Admin</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="doctors.html">Doctors</a>
      <a href="patients.html" class="active">Patients</a>
      <a href="appointments.html">Appointments</a>
      <a href="billing.html">Billing</a>
      <a href="settings.html">Settings</a>
    </aside>
    <main class="main">
      <div class="topbar">
        <span id="adminWelcome"></span>
        <button type="button" id="logoutBtn" class="danger">Logout</button>
      </div>
      <div class="card">
        <h3>Register Patient</h3>
        <form id="patientForm" class="form-grid">
          <input type="text" id="patName" placeholder="Patient Name" required />
          <input type="number" id="patAge" placeholder="Age" required />
          <input type="text" id="patPhone" placeholder="Phone" required />
          <input type="text" id="patCondition" placeholder="Condition" required />
          <button type="submit">Save Patient</button>
        </form>
      </div>
      <div class="card">
        <h3>Patients List</h3>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Phone</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="patientTableBody"></tbody>
        </table>
        <div id="patientDetailBox" class="patient-detail"></div>
      </div>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/patients.js"></script>
</body>

</html>
