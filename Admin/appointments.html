<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/appointments.css" />
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>HMS Admin</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="doctors.html">Doctors</a>
      <a href="patients.html">Patients</a>
      <a href="appointments.html" class="active">Appointments</a>
      <a href="billing.html">Billing</a>
      <a href="settings.html">Settings</a>
    </aside>
    <main class="main">
      <div class="topbar">
        <span id="adminWelcome"></span>
        <button type="button" id="logoutBtn" class="danger">Logout</button>
      </div>
      <div class="card">
        <h3>Create Appointment</h3>
        <form id="appointmentForm" class="form-grid">
          <input type="text" id="appPatient" placeholder="Patient Name" required />
          <input type="text" id="appDoctor" placeholder="Doctor Name" required />
          <input type="date" id="appDate" required />
          <button type="submit">Add Appointment</button>
        </form>
      </div>
      <div class="card">
        <h3>Appointments List</h3>
        <table>
          <thead>
            <tr>
              <th>Patient</th>
              <th>Doctor</th>
              <th>Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="appointmentTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/appointments.js"></script>
</body>

</html>
