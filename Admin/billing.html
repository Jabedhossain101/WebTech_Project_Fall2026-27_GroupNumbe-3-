<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/billing.css" />
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>HMS Admin</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="doctors.html">Doctors</a>
      <a href="patients.html">Patients</a>
      <a href="appointments.html">Appointments</a>
      <a href="billing.html" class="active">Billing</a>
      <a href="settings.html">Settings</a>
    </aside>
    <main class="main">
      <div class="topbar">
        <span id="adminWelcome"></span>
        <button type="button" id="logoutBtn" class="danger">Logout</button>
      </div>
      <div class="card">
        <h3>Create Invoice</h3>
        <form id="billingForm" class="form-grid">
          <input type="text" id="billPatient" placeholder="Patient Name" required />
          <input type="number" id="billAmount" placeholder="Amount (BDT)" required />
          <button type="submit">Add Bill</button>
        </form>
      </div>
      <div class="card">
        <h3>Invoices</h3>
        <table>
          <thead>
            <tr>
              <th>Patient</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="billingTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/billing.js"></script>
</body>

</html>
