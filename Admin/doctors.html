<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Doctors</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/doctors.css" />
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>HMS Admin</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="doctors.html" class="active">Doctors</a>
      <a href="patients.html">Patients</a>
      <a href="appointments.html">Appointments</a>
      <a href="billing.html">Billing</a>
      <a href="settings.html">Settings</a>
    </aside>
    <main class="main">
      <div class="topbar">
        <span id="adminWelcome"></span>
        <button type="button" id="logoutBtn" class="danger">Logout</button>
      </div>
      <div class="card">
        <h3>Add Doctor</h3>
        <form id="doctorForm" class="form-grid">
          <input type="text" id="docName" placeholder="Doctor Name" required />
          <input type="text" id="docDept" placeholder="Department" required />
          <button type="submit">Add Doctor</button>
        </form>
      </div>
      <div class="card">
        <h3>Doctors List</h3>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Department</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="doctorTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/doctors.js"></script>
</body>

</html>
