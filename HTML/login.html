
<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../CSS/Style.css">
        <script src="../js/main.js" defer></script>

        <title>Patient Login</title>
    </head>

    <body>
        <div class="container">

         <div class="header">
         <img src="../Assets/logo.png" id="logo">
        <h1>Patient Login</h1>
         </div>
         <div class="topnav">
         <a href="">Home</a>
         <a href="">About</a>
         <a href="">Contact</a>
         </div>
         <form onsubmit="return collect_data()" novalidate>
         <fieldset>
         <legend>Login Information</legend>
         <table>
            <tr>
            <td>
             <label for="PatientEmail">Email or Phone Number:</label>
            </td>
                 <td>

                   <input type="text" id="PatientEmail" name="PatientEmail"  placeholder="Enter Your Email or Phone Number" required>
                   <p id="EmailError"></p>
                  </td>
                  </tr>
                  <tr>
                    
                  <td>
                   <label for="Password">Password:</label>
                  </td>
                  <td>

                   <input type="password" id="Password" name="Password" placeholder="Enter Your Password" required>
                  <p id="PasswordError"></p>
                  </td>
                   </tr>
                   <tr>
                   <td colspan="2">
                     <input type="checkbox" id="Remember" name="Remember"> Remember me
                     <a href="">Forgot Password?</a>
                     </td>
                     </tr>

                     </table>
                    </fieldset>

                <input type="submit" id="submit" value="Login">


                <p>Don't have an account? <a href="register.html">Register</a></p>
                <p><a href=" ">Back to Home</a></p>

               </form>

                <div class="footer">

                   <h5>Medical Service Management System</h5>
                   <p>Your Health, Our Priority</p>
                   <p>Care for Every Patient, Every Day.</p>
               </div>
        </div>
    </body>
</html>
