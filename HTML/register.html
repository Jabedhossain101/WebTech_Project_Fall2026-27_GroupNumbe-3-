
<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../CSS/Style.css">
        <script src="../js/register.js"></script>

        <title>Patient Registration</title>
    </head>

    <body>

        <div class="container">

            <div class="header">
                <img src="../Assets/logo.png" id="logo">
                <h1>Patient Registration</h1>
            </div>

            <div class="topnav">
                <a href="">Home</a>
                <a href="">About</a>
                <a href="">Contact</a>
            </div>

            <form onsubmit="return collect_registration()" novalidate>

                <fieldset>
                    <legend>Patient Information</legend>

                    <table>
                        
                        <tr>
                            <td>
                                <label for="PatientName">Full Name:</label>
                            </td>
                            <td>
                                <input type="text" id="PatientName" name="PatientName" placeholder="Enter Your Full Name">
                                <p id="NameError"></p>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="PatientAge">Age:</label>
                            </td>
                            <td>
                                <input type="number" id="PatientAge" name="PatientAge" placeholder="Enter Your Age">
                                <p id="AgeError"></p>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="PatientEmail">Email:</label>
                            </td>
                            <td>
                                <input type="text" id="PatientEmail" name="PatientEmail" placeholder="Enter Your Email">
                                <p id="EmailError"></p>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="PatientPhone">Phone Number:</label>
                            </td>
                            <td>
                                <input type="text" id="PatientPhone" name="PatientPhone" placeholder="Enter Your Phone Number">
                                <p id="PhoneError"></p>
                            </td>
                        </tr>

                        <tr>
                            
                                <td> <label for="Gender"> Gender: </label> </td>
                                <td>

                                   <input type="radio" id="Male" name="Gender" value="Male"> Male
                                   <input type="radio" id="Female" name="Gender" value="Female"> Female
                                   <input type="radio" id="Other" name="Gender" value="Other">Other
                            
                                <p id="GenderError"></p>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="Password">Password:</label>
                            </td>
                            <td>
                                <input type="password" id="Password" name="Password" placeholder="Create Your Password">
                                <p id="PasswordError"></p>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="ConfirmPassword">Confirm Password:</label>
                            </td>
                            <td>
                                <input type="password" id="ConfirmPassword" name="ConfirmPassword" placeholder="Confirm Your Password">
                                <p id="ConfirmPasswordError"></p>
                            </td>
                        </tr>
                    </table>
                </fieldset>

                <input type="submit" id="submit" value="Register">

                <p>Already have an account? <a href="login.html">Login</a></p>

                <p><a href="../login.html">Back to Home</a></p>


            </form>

            <div class="footer">
                <h5>Medical Service Management System</h5>
                <p>Your Health, Our Priority</p>
                <p>Care for Every Patient, Every Day.</p>
            </div>
           
            </div>
    </body>
</html>
