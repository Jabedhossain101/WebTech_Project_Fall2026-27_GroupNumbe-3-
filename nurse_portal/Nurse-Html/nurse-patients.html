<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management</title>
    <link rel="stylesheet" href="../Nurse-CSS/style.css">
</head>  
<body>
    <div class="header">
        <h1>Nurse Portal</h1>
        <h3>Patient Management</h3>
    </div>
    <div class="topnav">
        <a href="nurse-patients.html">Patient Management</a>
        <a href="nurse-medicines.html">Medicine Management</a>
        <a href="nurse-shifts.html">Shift Scheduling</a>
    </div>

    <form id="patientForm" onsubmit="return validatePatientForm()" onreset="resetPatientForm()">
        <fieldset>
            <legend>Add Patient</legend>
            <table>
                <tr>
                    <td><label for="PatientName">Name</label></td>
                    <td><input type="text" id="PatientName" placeholder="Enter patient name">
                        <div class="error" id="NameError">
                            
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><label for="PatientAge">Age</label></td>
                    <td><input type="number" id="PatientAge" placeholder="Enter patient age">
                        <div class="error" id="AgeError">
                            
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><label for="PatientEmail">Email</label></td>
                    <td><input type="email" id="PatientEmail" placeholder="example@mail.com">
                        <div class="error" id="EmailError">
                            
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                        <label><input type="radio" name="Gender" value="Female"> Female</label>
                        <label><input type="radio" name="Gender" value="Male"> Male</label>
                        <label><input type="radio" name="Gender" value="Other"> Other</label>
                        <div class="error" id="GenderError">
                            
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><label for="PatientDept">Department</label>
                    </td>
                    <td>
                        <select id="PatientDept">
                            <option value="">-- Select Department --</option>
                            <option>Cardiology</option>
                            <option>Neurology</option>
                            <option>Orthopedics</option>
                            <option>Pediatrics</option>
                            <option>General Medicine</option>
                        </select>
                        <div class="error" id="DeptError"></div>
                    </td>
                </tr>
                <tr>
                    <td><label for="PatientNotes">Notes</label>
                    </td>
                    <td><textarea id="PatientNotes" placeholder="Enter patient notes"></textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <div class="success" id="PatientMsg">
                            
                        </div>
                        <div class="form-actions">
                            <input type="submit" id="submit" value="Add Patient">
                            <input type="reset" id="reset" value="Reset">
                        </div>
                    </td>
                </tr>       
            </table>
        </fieldset>
    </form>
    <div class="logout-wrap">
        <a class="logout-button" href="nurse-login.html">Logout</a>
    </div>
    <script src="../js/patients.js"></script>
</body>
</html>
